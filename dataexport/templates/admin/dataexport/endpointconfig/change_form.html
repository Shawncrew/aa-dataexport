{% extends "admin/change_form.html" %}

{% block after_field_sets %}
{{ block.super }}
{% if example %}
<fieldset class="module aligned">
  <h2>Example</h2>
  <p style="padding:0 12px"><b>Request</b> (replace <code>aadx_YOUR_KEY</code> with a key that has this endpoint ticked)</p>
  <pre style="white-space:pre-wrap;user-select:all;background:var(--darkened-bg);padding:8px;margin:0 12px 12px">{{ example.curl }}</pre>
  <p style="padding:0 12px"><b>Response</b> (fictional data)</p>
  <pre style="max-height:26em;overflow:auto;background:var(--darkened-bg);padding:8px;margin:0 12px 12px">{{ example.response }}</pre>
</fieldset>
{% endif %}
{% endblock %}
